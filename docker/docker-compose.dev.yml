services:
  # Caddy 反向代理 - 统一入口，代理到 Vite dev server
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # 前端开发服务器 - Vite HMR
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../web:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 后端服务 - Python FastAPI
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    working_dir: /app
    volumes:
      - ../server:/app
      - backend-cache:/app/.venv
      - ./data:/data
    environment:
      - DATABASE_PATH=/data/roam.db
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    command: sh -c "uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  frontend-node-modules:
  backend-cache:
