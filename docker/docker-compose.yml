services:
  # Caddy 反向代理 - 统一入口
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv/web:ro
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # 前端构建器 - 构建完成后退出
  frontend-builder:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../web:/app
      - web-dist:/app/dist
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run build"

  # 后端服务 - Python FastAPI
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-alpine
    working_dir: /app
    volumes:
      - ../server:/app
      - backend-cache:/app/.venv
      - ./data:/data
    environment:
      - DATABASE_PATH=/data/roam.db
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    command: sh -c "uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  web-dist:
  frontend-node-modules:
  backend-cache:
