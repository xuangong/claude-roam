name: Build CLI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build web preview
        working-directory: web
        run: npm run build:preview

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install

      - name: Build all platforms
        working-directory: cli
        run: |
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/claude-roam-darwin-arm64
          bun build src/index.ts --compile --target=bun-darwin-x64 --outfile dist/claude-roam-darwin-x64
          bun build src/index.ts --compile --target=bun-linux-x64 --outfile dist/claude-roam-linux-x64
          bun build src/index.ts --compile --target=bun-linux-arm64 --outfile dist/claude-roam-linux-arm64
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile dist/claude-roam-windows-x64.exe

      - name: Create archives
        working-directory: cli/dist
        run: |
          # macOS ARM64
          tar -czvf claude-roam-darwin-arm64.tar.gz claude-roam-darwin-arm64
          # macOS x64
          tar -czvf claude-roam-darwin-x64.tar.gz claude-roam-darwin-x64
          # Linux x64
          tar -czvf claude-roam-linux-x64.tar.gz claude-roam-linux-x64
          # Linux ARM64
          tar -czvf claude-roam-linux-arm64.tar.gz claude-roam-linux-arm64
          # Windows x64
          zip claude-roam-windows-x64.zip claude-roam-windows-x64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-roam-binaries
          path: |
            cli/dist/claude-roam-darwin-arm64.tar.gz
            cli/dist/claude-roam-darwin-x64.tar.gz
            cli/dist/claude-roam-linux-x64.tar.gz
            cli/dist/claude-roam-linux-arm64.tar.gz
            cli/dist/claude-roam-windows-x64.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: claude-roam-binaries
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/claude-roam-darwin-arm64.tar.gz
            dist/claude-roam-darwin-x64.tar.gz
            dist/claude-roam-linux-x64.tar.gz
            dist/claude-roam-linux-arm64.tar.gz
            dist/claude-roam-windows-x64.zip
          generate_release_notes: true
